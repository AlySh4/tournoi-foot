const STORAGE_KEY = "tournoi_foot_data_v1";

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}

function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
}

const INIT_NAMES = {
  A1: "Équipe A1", A2: "Équipe A2", A3: "Équipe A3", A4: "Équipe A4", A5: "Équipe A5",
  B1: "Équipe B1", B2: "Équipe B2", B3: "Équipe B3", B4: "Équipe B4", B5: "Équipe B5",
};

const CA = "#4caf50";
const CB = "#42a5f5";

function getStandings(group, scores) {
  const teams = [1,2,3,4,5].map(n => group + n);
  const st = {};
  teams.forEach(t => { st[t] = { code: t, pts: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, p: 0 }; });
  SCHEDULE.forEach(wk => wk.matches.forEach(m => {
    if (m.group !== group) return;
    const s = scores[m.id];
    if (!s) return;
    const a = parseInt(s.s1, 10), b = parseInt(s.s2, 10);
    if (isNaN(a) || isNaN(b)) return;
    st[m.team1].p++; st[m.team2].p++;
    st[m.team1].gf += a; st[m.team1].ga += b;
    st[m.team2].gf += b; st[m.team2].ga += a;
    if (a > b) { st[m.team1].pts += 3; st[m.team1].w++; st[m.team2].l++; }
    else if (a < b) { st[m.team2].pts += 3; st[m.team2].w++; st[m.team1].l++; }
    else { st[m.team1].pts++; st[m.team1].d++; st[m.team2].pts++; st[m.team2].d++; }
  }));
  return Object.values(st).sort((a, b) =>
    b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf
  );
}

function getTopScorers(scores, scorersData, knockoutMatches) {
  const map = {};
  // Pool matches
  SCHEDULE.forEach(wk => wk.matches.forEach(m => {
    const s = scores[m.id];
    if (!s) return;
    const a = parseInt(s.s1, 10), b = parseInt(s.s2, 10);
    if (isNaN(a) || isNaN(b)) return;
    const sd = scorersData[m.id];
    if (!sd) return;
    for (let i = 0; i < a; i++) {
      const nm = (sd["t1_" + i] || "").trim();
      if (!nm) continue;
      const k = nm.toLowerCase() + "|" + m.team1;
      if (!map[k]) map[k] = { name: nm, team: m.team1, goals: 0 };
      map[k].goals++;
    }
    for (let i = 0; i < b; i++) {
      const nm = (sd["t2_" + i] || "").trim();
      if (!nm) continue;
      const k = nm.toLowerCase() + "|" + m.team2;
      if (!map[k]) map[k] = { name: nm, team: m.team2, goals: 0 };
      map[k].goals++;
    }
  }));
  // Knockout matches
  if (knockoutMatches) {
    knockoutMatches.forEach(m => {
      if (!m.team1 || !m.team2) return;
      const s = scores[m.id];
      if (!s) return;
      const a = parseInt(s.s1, 10), b = parseInt(s.s2, 10);
      if (isNaN(a) || isNaN(b)) return;
      const sd = scorersData[m.id];
      if (!sd) return;
      for (let i = 0; i < a; i++) {
        const nm = (sd["t1_" + i] || "").trim();
        if (!nm) continue;
        const k = nm.toLowerCase() + "|" + m.team1;
        if (!map[k]) map[k] = { name: nm, team: m.team1, goals: 0 };
        map[k].goals++;
      }
      for (let i = 0; i < b; i++) {
        const nm = (sd["t2_" + i] || "").trim();
        if (!nm) continue;
        const k = nm.toLowerCase() + "|" + m.team2;
        if (!map[k]) map[k] = { name: nm, team: m.team2, goals: 0 };
        map[k].goals++;
      }
    });
  }
  return Object.values(map).sort((a, b) => b.goals - a.goals);
}

function getRank(list, idx) {
  if (idx === 0) return 1;
  if (list[idx].goals === list[idx - 1].goals) return getRank(list, idx - 1);
  return idx + 1;
}

// Knockout match IDs
const KO_MATCHES = {
  // Champions League
  cl_sf1: { id: "cl_sf1", label: "Demi-finale 1", source1: "A1", source2: "B2" },
  cl_sf2: { id: "cl_sf2", label: "Demi-finale 2", source1: "B1", source2: "A2" },
  cl_3rd: { id: "cl_3rd", label: "Match pour la 3ᵉ place", source1: "LOSER:cl_sf1", source2: "LOSER:cl_sf2" },
  cl_final: { id: "cl_final", label: "Finale", source1: "WINNER:cl_sf1", source2: "WINNER:cl_sf2" },
  // Europa League
  el_sf1: { id: "el_sf1", label: "Demi-finale 1", source1: "A3", source2: "B4" },
  el_sf2: { id: "el_sf2", label: "Demi-finale 2", source1: "B3", source2: "A4" },
  el_3rd: { id: "el_3rd", label: "Match pour la 3ᵉ place", source1: "LOSER:el_sf1", source2: "LOSER:el_sf2" },
  el_final: { id: "el_final", label: "Finale", source1: "WINNER:el_sf1", source2: "WINNER:el_sf2" },
  // Conference League
  cf_final: { id: "cf_final", label: "Finale", source1: "A5", source2: "B5" },
};

const DEFAULT_KO_DATES = {
  cl_sf1: "9 juin", cl_sf2: "9 juin", cl_3rd: "16 juin", cl_final: "16 juin",
  el_sf1: "10 juin", el_sf2: "10 juin", el_3rd: "17 juin", el_final: "17 juin",
  cf_final: "10 juin",
};

// Resolve a source token (e.g. "A1" = 1st of group A, "WINNER:cl_sf1" = winner of cl_sf1) to a team code
function resolveSource(token, standingsA, standingsB, scores) {
  if (!token) return null;
  if (token.startsWith("WINNER:") || token.startsWith("LOSER:")) {
    const wantWinner = token.startsWith("WINNER:");
    const refId = token.split(":")[1];
    const s = scores[refId];
    if (!s) return null;
    const a = parseInt(s.s1, 10), b = parseInt(s.s2, 10);
    if (isNaN(a) || isNaN(b)) return null;
    const ko = KO_MATCHES[refId];
    if (!ko) return null;
    const t1 = resolveSource(ko.source1, standingsA, standingsB, scores);
    const t2 = resolveSource(ko.source2, standingsA, standingsB, scores);
    if (!t1 || !t2) return null;
    // Tie: use penalty winner if specified
    if (a === b) {
      if (s.pen === "1") return wantWinner ? t1 : t2;
      if (s.pen === "2") return wantWinner ? t2 : t1;
      return null; // tied with no penalty winner = unresolved
    }
    if (a > b) return wantWinner ? t1 : t2;
    return wantWinner ? t2 : t1;
  }
  // Format: "A1" = group A pos 1
  const group = token[0];
  const pos = parseInt(token.slice(1), 10);
  const list = group === "A" ? standingsA : standingsB;
  if (!list || !list[pos - 1]) return null;
  const allPlayed = list.every(t => t.p === 4);
  if (!allPlayed) return null;
  return list[pos - 1].code;
}

function getKnockoutMatch(koId, standingsA, standingsB, scores) {
  const ko = KO_MATCHES[koId];
  if (!ko) return null;
  return {
    id: ko.id,
    label: ko.label,
    team1: resolveSource(ko.source1, standingsA, standingsB, scores),
    team2: resolveSource(ko.source2, standingsA, standingsB, scores),
    placeholder1: ko.source1.startsWith("WINNER:") ? "Vainqueur " + KO_MATCHES[ko.source1.split(":")[1]].label
                  : ko.source1.startsWith("LOSER:") ? "Perdant " + KO_MATCHES[ko.source1.split(":")[1]].label
                  : ko.source1[0] === "A" ? ko.source1.slice(1) + (ko.source1[1] === "1" ? "ᵉʳ" : "ᵉ") + " Poule A"
                  : ko.source1.slice(1) + (ko.source1[1] === "1" ? "ᵉʳ" : "ᵉ") + " Poule B",
    placeholder2: ko.source2.startsWith("WINNER:") ? "Vainqueur " + KO_MATCHES[ko.source2.split(":")[1]].label
                  : ko.source2.startsWith("LOSER:") ? "Perdant " + KO_MATCHES[ko.source2.split(":")[1]].label
                  : ko.source2[0] === "A" ? ko.source2.slice(1) + (ko.source2[1] === "1" ? "ᵉʳ" : "ᵉ") + " Poule A"
                  : ko.source2.slice(1) + (ko.source2[1] === "1" ? "ᵉʳ" : "ᵉ") + " Poule B",
  };
}

function App() {

    saveData({ names, scores, scorers: scorersData, knockoutDates });
  }, [names, scores, scorersData, knockoutDates]);

  const dn = useCallback((c) => names[c] || c, [names]);

  const handleScore = useCallback((mid, side, val) => {
    if (val !== "" && !/^\d+$/.test(val)) return;
    setScores(p => {
      const prev = p[mid] || {};
      const next = { ...prev, [side]: val };
      if (next.s1 === "" && next.s2 === "") {
        const copy = { ...p };
        delete copy[mid];
        return copy;
      }
      // Clear pen winner if no longer a tie
      const a = parseInt(next.s1, 10), b = parseInt(next.s2, 10);
      if (!isNaN(a) && !isNaN(b) && a !== b) {
        delete next.pen;
      }
      return { ...p, [mid]: next };
    });
  }, []);

  const handleScorer = useCallback((mid, key, val) => {
    setScorersData(p => ({ ...p, [mid]: { ...(p[mid] || {}), [key]: val } }));
  }, []);

  const handlePen = useCallback((mid, val) => {
    setScores(p => {
      const prev = p[mid] || {};
      const next = { ...prev, pen: val };
      return { ...p, [mid]: next };
    });
  }, []);

  const handleExport = () => {
    const data = { version: 2, exportDate: new Date().toISOString(), names, scores, scorers: scorersData, knockoutDates };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const date = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = "tournoi-sauvegarde-" + date + ".json";
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleImport = (e) => {
    const file = e.target.files[0];

    const reader = new FileReader();

      try {
        const data = JSON.parse(evt.target.result);

          alert("Fichier invalide : données manquantes.");
          return;
        }
        if (window.confirm("Charger cette sauvegarde ? Les données actuelles seront remplacées.")) {

      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

                    <div style={{ display: "flex", alignItems: "center", gap: 4, background: "rgba(255,255,255,0.1)", borderRadius: 8, padding: "4px 10px", flexShrink: 0 }}>
                      <span style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 16, fontWeight: 800, color: "#ffd54f" }}>{s.goals}</span>
                      <span style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 10, fontWeight: 600, color: "rgba(255,255,255,0.4)" }}>but{s.goals > 1 ? "s" : ""}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          {topS.length > 0 && (
            <div style={{ padding: "8px 14px", background: "rgba(255,255,255,0.03)", borderTop: "1px solid rgba(255,255,255,0.06)", fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: "rgba(255,255,255,0.3)", textAlign: "center" }}>
              {topS.length} buteur{topS.length > 1 ? "s" : ""} • {topS.reduce((a, s) => a + s.goals, 0)} buts au total
            </div>
          )}
        </div>
      )}

      {/* ========== CALENDAR ========== */}
      {tab === "calendar" && (
        <div>
          <div style={{ display: "flex", gap: 4, marginBottom: 10, justifyContent: "center", flexWrap: "wrap" }}>
            <button onClick={() => setWeek(null)} style={wkBtn(week === null)}>Tout</button>
            {SCHEDULE.map(w => (
              <button key={w.week} onClick={() => setWeek(w.week)} style={wkBtn(week === w.week)}>S{w.week}</button>
            ))}
          </div>

          <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: "rgba(255,255,255,0.5)", textAlign: "center", marginBottom: 12, padding: "6px 10px", background: "rgba(255,215,0,0.08)", borderRadius: 6, border: "1px solid rgba(255,215,0,0.15)" }}>
            💡 Entrez un score puis tapez sur le match pour ajouter les buteurs
          </div>

          {SCHEDULE.filter(w => week === null || w.week === week).map(w => (
            <div key={w.week} style={{ marginBottom: 14, background: "rgba(255,255,255,0.06)", borderRadius: 10, border: "1px solid rgba(255,255,255,0.1)", overflow: "hidden", backdropFilter: "blur(4px)" }}>
              <div style={{ padding: "10px 14px", borderBottom: "1px solid rgba(255,255,255,0.08)", background: "rgba(255,255,255,0.04)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <span style={{ fontWeight: 700, fontSize: 15, color: "#fff" }}>Semaine {w.week}</span>
                  <span style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: "rgba(255,255,255,0.35)", marginLeft: 8 }}>{w.label}</span>
                </div>
                <span style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: "rgba(255,255,255,0.4)" }}>{w.matches.length} match{w.matches.length > 1 ? "s" : ""}</span>
              </div>
              {w.matches.map((m, i) => {
                const sc = scores[m.id] || {};
                const a = parseInt(sc.s1, 10), b = parseInt(sc.s2, 10);
                const ok = !isNaN(a) && !isNaN(b);
                const hasGoals = ok && (a + b > 0);
                const isOpen = open === m.id;
                const sd = scorersData[m.id] || {};
                const total = hasGoals ? a + b : 0;
                const filled = hasGoals
                  ? [...Array(a)].filter((_, j) => (sd["t1_" + j] || "").trim()).length
                    + [...Array(b)].filter((_, j) => (sd["t2_" + j] || "").trim()).length
                  : 0;
                const col = gc(m.group);

                return (
                  <div key={m.id} style={{ borderBottom: i < w.matches.length - 1 ? "1px solid rgba(255,255,255,0.05)" : "none" }}>
                    <div
                      onClick={() => hasGoals && setOpen(isOpen ? null : m.id)}
                      style={{ padding: "11px 14px", display: "flex", flexDirection: "column", gap: 6, cursor: hasGoals ? "pointer" : "default" }}
                    >
                      <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                        <span style={{ display: "inline-block", padding: "2px 8px", borderRadius: 4, fontSize: 11, fontWeight: 600, color: m.day === "Mardi" ? "#ffd54f" : "#ce93d8", background: m.day === "Mardi" ? "rgba(255,213,79,0.12)" : "rgba(206,147,216,0.12)" }}>{m.day} {m.date}</span>
                        <span style={{ display: "inline-block", padding: "1px 6px", borderRadius: 4, fontSize: 10, fontWeight: 700, letterSpacing: .5, color: "#fff", background: col }}>POULE {m.group}</span>
                        {hasGoals && (
                          <span style={{
                            marginLeft: "auto", fontFamily: "'DM Sans',sans-serif", fontSize: 10, fontWeight: 600,
                            color: filled === total ? "#81c784" : "#ffd54f",
                            background: filled === total ? "rgba(129,199,132,0.12)" : "rgba(255,213,79,0.12)",
                            padding: "1px 6px", borderRadius: 4,
                          }}>
                            {filled === total ? "✓ Buteurs" : filled + "/" + total + " buteurs"} {isOpen ? "▲" : "▼"}
                          </span>
                        )}
                      </div>

                      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                        <span style={{ fontFamily: "'DM Sans',sans-serif", fontWeight: 700, fontSize: 13, textAlign: "right", flex: 1, color: col, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", minWidth: 0 }}>{dn(m.team1)}</span>
                        <div onClick={e => e.stopPropagation()} style={{ display: "flex", alignItems: "center", gap: 4, background: "rgba(255,255,255,0.06)", borderRadius: 8, padding: "4px 6px", flexShrink: 0 }}>
                          <input type="text" inputMode="numeric" maxLength={2}
                            value={sc.s1 !== undefined ? sc.s1 : ""}
                            onChange={e => handleScore(m.id, "s1", e.target.value)}
                            placeholder="-"
                            style={sIn(ok && a > b)} />
                          <span style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 12, fontWeight: 700, color: "rgba(255,255,255,0.2)" }}>:</span>
                          <input type="text" inputMode="numeric" maxLength={2}
                            value={sc.s2 !== undefined ? sc.s2 : ""}
                            onChange={e => handleScore(m.id, "s2", e.target.value)}
                            placeholder="-"
                            style={sIn(ok && b > a)} />
                        </div>
                        <span style={{ fontFamily: "'DM Sans',sans-serif", fontWeight: 700, fontSize: 13, textAlign: "left", flex: 1, color: col, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", minWidth: 0 }}>{dn(m.team2)}</span>
                      </div>

                      <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: "rgba(255,255,255,0.35)", display: "flex", alignItems: "center", gap: 4 }}>
                        🟨 Arbitre : <strong style={{ color: "rgba(255,255,255,0.55)" }}>{dn(m.ref)}</strong>
                      </div>
                    </div>

                    {isOpen && hasGoals && (
                      <div onClick={e => e.stopPropagation()} style={{ padding: "10px 12px 12px", background: "rgba(255,255,255,0.03)", borderTop: "1px dashed rgba(255,255,255,0.1)", display: "flex", gap: 10 }}>
                        {a > 0 && (
                          <div style={{ flex: 1 }}>
                            <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 10, fontWeight: 700, color: col, letterSpacing: .5, marginBottom: 5, textTransform: "uppercase" }}>{dn(m.team1)}</div>
                            {[...Array(a)].map((_, j) => (
                              <div key={j} style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 4 }}>
                                <span style={{ fontSize: 11 }}>⚽</span>
                                <input type="text"
                                  value={sd["t1_" + j] || ""}
                                  onChange={e => handleScorer(m.id, "t1_" + j, e.target.value)}
                                  placeholder={"Buteur " + (j + 1)}
                                  style={{
                                    fontFamily: "'DM Sans',sans-serif", fontSize: 16, fontWeight: 500,
                                    padding: "8px 10px", borderRadius: 6, outline: "none", flex: 1, color: "#e8eaf6",
                                    border: sd["t1_" + j] ? "1.5px solid " + col + "55" : "1px solid rgba(255,255,255,0.12)",
                                    background: sd["t1_" + j] ? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.03)",
                                  }} />
                              </div>
                            ))}
                          </div>
                        )}
                        {b > 0 && (
                          <div style={{ flex: 1 }}>
                            <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 10, fontWeight: 700, color: col, letterSpacing: .5, marginBottom: 5, textTransform: "uppercase" }}>{dn(m.team2)}</div>
                            {[...Array(b)].map((_, j) => (
                              <div key={j} style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 4 }}>
                                <span style={{ fontSize: 11 }}>⚽</span>
                                <input type="text"
                                  value={sd["t2_" + j] || ""}
                                  onChange={e => handleScorer(m.id, "t2_" + j, e.target.value)}
                                  placeholder={"Buteur " + (j + 1)}
                                  style={{
                                    fontFamily: "'DM Sans',sans-serif", fontSize: 16, fontWeight: 500,
                                    padding: "8px 10px", borderRadius: 6, outline: "none", flex: 1, color: "#e8eaf6",
                                    border: sd["t2_" + j] ? "1.5px solid " + col + "55" : "1px solid rgba(255,255,255,0.12)",
                                    background: sd["t2_" + j] ? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.03)",
                                  }} />
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      )}

      {/* ========== KNOCKOUT STAGES ========== */}
      {(tab === "cl" || tab === "el" || tab === "cf") && (() => {
        const compInfo = {
          cl: { title: "Champions League", emoji: "⭐", color: "#ffd54f", gradient: "linear-gradient(135deg, rgba(255,213,79,0.15), rgba(255,143,0,0.08))" },
          el: { title: "Europa League", emoji: "🏅", color: "#ff8a65", gradient: "linear-gradient(135deg, rgba(255,138,101,0.15), rgba(230,74,25,0.08))" },
          cf: { title: "Conference League", emoji: "🌍", color: "#81c784", gradient: "linear-gradient(135deg, rgba(129,199,132,0.15), rgba(46,125,50,0.08))" },
        }[tab];
        const matches = koByCompetition[tab];
        const sectionLabel = tab === "cf" ? [{ label: "Finale", ids: ["cf_final"] }]
          : tab === "cl" ? [
            { label: "Demi-finales", ids: ["cl_sf1", "cl_sf2"] },
            { label: "Match pour la 3ᵉ place", ids: ["cl_3rd"] },
            { label: "Finale", ids: ["cl_final"] },
          ] : [
            { label: "Demi-finales", ids: ["el_sf1", "el_sf2"] },
            { label: "Match pour la 3ᵉ place", ids: ["el_3rd"] },
            { label: "Finale", ids: ["el_final"] },
          ];

        return (
          <div>
            <div style={{
              padding: "14px 16px", marginBottom: 14, borderRadius: 10,
              background: compInfo.gradient, border: "1px solid " + compInfo.color + "33",
              textAlign: "center",
            }}>
              <div style={{ fontSize: 24, marginBottom: 4 }}>{compInfo.emoji}</div>
              <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 16, fontWeight: 700, color: compInfo.color, letterSpacing: 1 }}>
                {compInfo.title}
              </div>
            </div>

            {sectionLabel.map(section => (
              <div key={section.label} style={{ marginBottom: 14 }}>
                <div style={{
                  fontFamily: "'DM Sans',sans-serif", fontSize: 11, fontWeight: 700,
                  color: "rgba(255,255,255,0.5)", letterSpacing: 1.5, textTransform: "uppercase",
                  marginBottom: 8, paddingLeft: 4,
                }}>{section.label}</div>

                {section.ids.map(matchId => {
                  const m = matches.find(x => x.id === matchId);
                  if (!m) return null;
                  const sc = scores[m.id] || {};
                  const a = parseInt(sc.s1, 10), b = parseInt(sc.s2, 10);
                  const ok = !isNaN(a) && !isNaN(b);
                  const hasGoals = ok && (a + b > 0);
                  const isOpen = open === m.id;
                  const sd = scorersData[m.id] || {};
                  const teamsReady = m.team1 && m.team2;
                  const totalG = hasGoals ? a + b : 0;
                  const filled = hasGoals
                    ? [...Array(a)].filter((_, j) => (sd["t1_" + j] || "").trim()).length
                      + [...Array(b)].filter((_, j) => (sd["t2_" + j] || "").trim()).length
                    : 0;

                  return (
                    <div key={m.id} style={{
                      background: "rgba(255,255,255,0.06)", borderRadius: 10,
                      border: "1px solid " + compInfo.color + "22", overflow: "hidden",
                      marginBottom: 8, backdropFilter: "blur(4px)",
                    }}>
                      <div
                        onClick={() => hasGoals && teamsReady && setOpen(isOpen ? null : m.id)}
                        style={{ padding: "12px 14px", display: "flex", flexDirection: "column", gap: 8, cursor: (hasGoals && teamsReady) ? "pointer" : "default" }}
                      >
                        <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                          <input
                            type="text" value={knockoutDates[m.id] || ""}
                            onChange={e => setKoDate(m.id, e.target.value)}
                            onClick={e => e.stopPropagation()}
                            placeholder="Date"
                            style={{
                              fontFamily: "'DM Sans',sans-serif", fontSize: 12, fontWeight: 600,
                              padding: "4px 10px", borderRadius: 4, outline: "none",
                              border: "1px solid " + compInfo.color + "44",
                              background: compInfo.color + "12", color: compInfo.color,
                              width: "auto", maxWidth: 120,
                            }}
                          />
                          {hasGoals && teamsReady && (
                            <span style={{
                              marginLeft: "auto", fontFamily: "'DM Sans',sans-serif", fontSize: 10, fontWeight: 600,
                              color: filled === totalG ? "#81c784" : "#ffd54f",
                              background: filled === totalG ? "rgba(129,199,132,0.12)" : "rgba(255,213,79,0.12)",
                              padding: "2px 7px", borderRadius: 4,
                            }}>
                              {filled === totalG ? "✓ Buteurs" : filled + "/" + totalG + " buteurs"} {isOpen ? "▲" : "▼"}
                            </span>
                          )}
                        </div>

                        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                          <span style={{
                            fontFamily: "'DM Sans',sans-serif", fontWeight: 700, fontSize: 13,
                            textAlign: "right", flex: 1,
                            color: m.team1 ? (m.team1[0] === "A" ? CA : CB) : "rgba(255,255,255,0.35)",
                            fontStyle: m.team1 ? "normal" : "italic",
                            overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", minWidth: 0,
                          }}>{m.team1 ? dn(m.team1) : m.placeholder1}</span>

                          <div onClick={e => e.stopPropagation()} style={{ display: "flex", alignItems: "center", gap: 4, background: "rgba(255,255,255,0.06)", borderRadius: 8, padding: "4px 6px", flexShrink: 0 }}>
                            <input type="text" inputMode="numeric" maxLength={2}
                              value={sc.s1 !== undefined ? sc.s1 : ""}
                              onChange={e => handleScore(m.id, "s1", e.target.value)}
                              placeholder="-" disabled={!teamsReady}
                              style={{ ...sIn(ok && (a > b || (a === b && sc.pen === "1"))), opacity: teamsReady ? 1 : 0.4 }} />
                            <span style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 12, fontWeight: 700, color: "rgba(255,255,255,0.2)" }}>:</span>
                            <input type="text" inputMode="numeric" maxLength={2}
                              value={sc.s2 !== undefined ? sc.s2 : ""}
                              onChange={e => handleScore(m.id, "s2", e.target.value)}
                              placeholder="-" disabled={!teamsReady}
                              style={{ ...sIn(ok && (b > a || (a === b && sc.pen === "2"))), opacity: teamsReady ? 1 : 0.4 }} />
                          </div>

                          <span style={{
                            fontFamily: "'DM Sans',sans-serif", fontWeight: 700, fontSize: 13,
                            textAlign: "left", flex: 1,
                            color: m.team2 ? (m.team2[0] === "A" ? CA : CB) : "rgba(255,255,255,0.35)",
                            fontStyle: m.team2 ? "normal" : "italic",
                            overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", minWidth: 0,
                          }}>{m.team2 ? dn(m.team2) : m.placeholder2}</span>
                        </div>

                        {ok && teamsReady && a === b && (sc.pen === "1" || sc.pen === "2") && (
                          <div style={{
                            fontFamily: "'DM Sans',sans-serif", fontSize: 10, fontWeight: 700,
                            color: "#ffd54f", textAlign: "center", letterSpacing: .5,
                            marginTop: -2,
                          }}>
                            🏆 {dn(sc.pen === "1" ? m.team1 : m.team2)} vainqueur aux t.a.b.
                          </div>
                        )}

                        {ok && teamsReady && a === b && (
                          <div onClick={e => e.stopPropagation()} style={{
                            display: "flex", flexDirection: "column", gap: 6,
                            padding: "10px 12px", borderRadius: 8,
                            background: "rgba(255,213,79,0.08)", border: "1px dashed rgba(255,213,79,0.3)",
                            marginTop: 4,
                          }}>
                            <div style={{
                              fontFamily: "'DM Sans',sans-serif", fontSize: 11, fontWeight: 700,
                              color: "#ffd54f", textAlign: "center", letterSpacing: .5,
                            }}>⚽ Égalité — Vainqueur aux tirs au but</div>
                            <div style={{ display: "flex", gap: 6 }}>
                              <button onClick={() => handlePen(m.id, sc.pen === "1" ? "" : "1")} style={{
                                flex: 1, fontFamily: "'DM Sans',sans-serif", fontSize: 12, fontWeight: 600,
                                padding: "8px 6px", borderRadius: 6, cursor: "pointer", minHeight: 38,
                                border: sc.pen === "1" ? "2px solid #ffd54f" : "1px solid rgba(255,255,255,0.15)",
                                background: sc.pen === "1" ? "rgba(255,213,79,0.2)" : "rgba(255,255,255,0.04)",
                                color: sc.pen === "1" ? "#fff" : "rgba(255,255,255,0.6)",
                                overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
                              }}>{sc.pen === "1" ? "✓ " : ""}{dn(m.team1)}</button>
                              <button onClick={() => handlePen(m.id, sc.pen === "2" ? "" : "2")} style={{
                                flex: 1, fontFamily: "'DM Sans',sans-serif", fontSize: 12, fontWeight: 600,
                                padding: "8px 6px", borderRadius: 6, cursor: "pointer", minHeight: 38,
                                border: sc.pen === "2" ? "2px solid #ffd54f" : "1px solid rgba(255,255,255,0.15)",
                                background: sc.pen === "2" ? "rgba(255,213,79,0.2)" : "rgba(255,255,255,0.04)",
                                color: sc.pen === "2" ? "#fff" : "rgba(255,255,255,0.6)",
                                overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
                              }}>{sc.pen === "2" ? "✓ " : ""}{dn(m.team2)}</button>
                            </div>
                          </div>
                        )}

                        {!teamsReady && (
                          <div style={{
                            fontFamily: "'DM Sans',sans-serif", fontSize: 10, color: "rgba(255,255,255,0.4)",
                            textAlign: "center", fontStyle: "italic", marginTop: 2,
                          }}>
                            En attente du classement final des poules
                          </div>
                        )}
                      </div>

                      {isOpen && hasGoals && teamsReady && (
                        <div onClick={e => e.stopPropagation()} style={{ padding: "10px 12px 12px", background: "rgba(255,255,255,0.03)", borderTop: "1px dashed rgba(255,255,255,0.1)", display: "flex", gap: 10 }}>
                          {a > 0 && (
                            <div style={{ flex: 1 }}>
                              <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 10, fontWeight: 700, color: m.team1[0] === "A" ? CA : CB, letterSpacing: .5, marginBottom: 5, textTransform: "uppercase" }}>{dn(m.team1)}</div>
                              {[...Array(a)].map((_, j) => {
                                const col = m.team1[0] === "A" ? CA : CB;
                                return (
                                  <div key={j} style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 4 }}>
                                    <span style={{ fontSize: 11 }}>⚽</span>
                                    <input type="text"
                                      value={sd["t1_" + j] || ""}
                                      onChange={e => handleScorer(m.id, "t1_" + j, e.target.value)}
                                      placeholder={"Buteur " + (j + 1)}
                                      style={{
                                        fontFamily: "'DM Sans',sans-serif", fontSize: 16, fontWeight: 500,
                                        padding: "8px 10px", borderRadius: 6, outline: "none", flex: 1, color: "#e8eaf6",
                                        border: sd["t1_" + j] ? "1.5px solid " + col + "55" : "1px solid rgba(255,255,255,0.12)",
                                        background: sd["t1_" + j] ? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.03)",
                                      }} />
                                  </div>
                                );
                              })}
                            </div>
                          )}
                          {b > 0 && (
                            <div style={{ flex: 1 }}>
                              <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 10, fontWeight: 700, color: m.team2[0] === "A" ? CA : CB, letterSpacing: .5, marginBottom: 5, textTransform: "uppercase" }}>{dn(m.team2)}</div>
                              {[...Array(b)].map((_, j) => {
                                const col = m.team2[0] === "A" ? CA : CB;
                                return (
                                  <div key={j} style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 4 }}>
                                    <span style={{ fontSize: 11 }}>⚽</span>
                                    <input type="text"
                                      value={sd["t2_" + j] || ""}
                                      onChange={e => handleScorer(m.id, "t2_" + j, e.target.value)}
                                      placeholder={"Buteur " + (j + 1)}
                                      style={{
                                        fontFamily: "'DM Sans',sans-serif", fontSize: 16, fontWeight: 500,
                                        padding: "8px 10px", borderRadius: 6, outline: "none", flex: 1, color: "#e8eaf6",
                                        border: sd["t2_" + j] ? "1.5px solid " + col + "55" : "1px solid rgba(255,255,255,0.12)",
                                        background: sd["t2_" + j] ? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.03)",
                                      }} />
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        );
      })()}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
