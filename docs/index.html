function resolveSource(token,stA,stB,scores){if(!token)return null;if(token.indexOf("WINNER:")===0||token.indexOf("LOSER:")===0){var w=token.indexOf("WINNER:")===0;var rid=token.split(":")[1];var s=scores[rid];if(!s)return null;var a=parseInt(s.s1,10),b=parseInt(s.s2,10);if(isNaN(a)||isNaN(b))return null;var ko=KO_MATCHES[rid];if(!ko)return null;var t1=resolveSource(ko.source1,stA,stB,scores);var t2=resolveSource(ko.source2,stA,stB,scores);if(!t1||!t2)return null;if(a===b){if(s.pen==="1")return w?t1:t2;if(s.pen==="2")return w?t2:t1;return null}if(a>b)return w?t1:t2;return w?t2:t1}var g=token[0];var pos=parseInt(token.slice(1),10);var list=g==="A"?stA:stB;if(!list||!list[pos-1])return null;var ap=list.every(function(t){return t.p===4});if(!ap)return null;return list[pos-1].code}

function getTopScorers(){var map={};SCHEDULE.forEach(function(wk){wk.matches.forEach(function(m){var s=DATA.scores[m.id];if(!s)return;var a=parseInt(s.s1,10),b=parseInt(s.s2,10);if(isNaN(a)||isNaN(b))return;var sd=DATA.scorers[m.id];if(!sd)return;for(var i=0;i<a;i++){var nm=(sd["t1_"+i]||"").trim();if(!nm)continue;var k=nm.toLowerCase()+"|"+m.team1;if(!map[k])map[k]={name:nm,team:m.team1,goals:0};map[k].goals++}for(var i=0;i<b;i++){var nm=(sd["t2_"+i]||"").trim();if(!nm)continue;var k=nm.toLowerCase()+"|"+m.team2;if(!map[k])map[k]={name:nm,team:m.team2,goals:0};map[k].goals++}})});var stA=getStandings("A"),stB=getStandings("B");var kos=getAllKO(stA,stB);kos.forEach(function(m){if(!m||!m.team1||!m.team2)return;var s=DATA.scores[m.id];if(!s)return;var a=parseInt(s.s1,10),b=parseInt(s.s2,10);if(isNaN(a)||isNaN(b))return;var sd=DATA.scorers[m.id];if(!sd)return;for(var i=0;i<a;i++){var nm=(sd["t1_"+i]||"").trim();if(!nm)continue;var k=nm.toLowerCase()+"|"+m.team1;if(!map[k])map[k]={name:nm,team:m.team1,goals:0};map[k].goals++}for(var i=0;i<b;i++){var nm=(sd["t2_"+i]||"").trim();if(!nm)continue;var k=nm.toLowerCase()+"|"+m.team2;if(!map[k])map[k]={name:nm,team:m.team2,goals:0};map[k].goals++}});return Object.values(map).sort(function(a,b){return b.goals-a.goals})}
