const { useState, useMemo, useCallback, useEffect } = React;

const STORAGE_KEY = "tournoi_foot_data_v1";

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}

function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
}

const INIT_NAMES = {
  A1: "Équipe A1", A2: "Équipe A2", A3: "Équipe A3", A4: "Équipe A4", A5: "Équipe A5",
  B1: "Équipe B1", B2: "Équipe B2", B3: "Équipe B3", B4: "Équipe B4", B5: "Équipe B5",
};

const CA = "#4caf50";
const CB = "#42a5f5";

function getStandings(group, scores) {
  const teams = [1,2,3,4,5].map(n => group + n);
  const st = {};
  teams.forEach(t => { st[t] = { code: t, pts: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, p: 0 }; });
  SCHEDULE.forEach(wk => wk.matches.forEach(m => {
    if (m.group !== group) return;
    const s = scores[m.id];
    if (!s) return;
    const a = parseInt(s.s1, 10), b = parseInt(s.s2, 10);
    if (isNaN(a) || isNaN(b)) return;
    st[m.team1].p++; st[m.team2].p++;
    st[m.team1].gf += a; st[m.team1].ga += b;
    st[m.team2].gf += b; st[m.team2].ga += a;
    if (a > b) { st[m.team1].pts += 3; st[m.team1].w++; st[m.team2].l++; }
    else if (a < b) { st[m.team2].pts += 3; st[m.team2].w++; st[m.team1].l++; }
    else { st[m.team1].pts++; st[m.team1].d++; st[m.team2].pts++; st[m.team2].d++; }
  }));
  return Object.values(st).sort((a, b) =>
    b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf
  );
}

function getTopScorers(scores, scorersData) {
  const map = {};
  SCHEDULE.forEach(wk => wk.matches.forEach(m => {
    const s = scores[m.id];
    if (!s) return;
    const a = parseInt(s.s1, 10), b = parseInt(s.s2, 10);
    if (isNaN(a) || isNaN(b)) return;
    const sd = scorersData[m.id];
    if (!sd) return;
    for (let i = 0; i < a; i++) {
      const nm = (sd["t1_" + i] || "").trim();
      if (!nm) continue;
      const k = nm.toLowerCase() + "|" + m.team1;
      if (!map[k]) map[k] = { name: nm, team: m.team1, goals: 0 };
      map[k].goals++;
    }
    for (let i = 0; i < b; i++) {
      const nm = (sd["t2_" + i] || "").trim();
      if (!nm) continue;
      const k = nm.toLowerCase() + "|" + m.team2;
      if (!map[k]) map[k] = { name: nm, team: m.team2, goals: 0 };
      map[k].goals++;
    }
  }));
  return Object.values(map).sort((a, b) => b.goals - a.goals);
}

function getRank(list, idx) {
  if (idx === 0) return 1;
  if (list[idx].goals === list[idx - 1].goals) return getRank(list, idx - 1);
  return idx + 1;
}

  const [scorersData, setScorersData] = useState(saved?.scorers || {});
  const [open, setOpen] = useState(null);

  // Auto-save on every change
  useEffect(() => {
    saveData({ names, scores, scorers: scorersData });
  }, [names, scores, scorersData]);

  const dn = useCallback((c) => names[c] || c, [names]);

  const handleScore = useCallback((mid, side, val) => {
    if (val !== "" && !/^\d+$/.test(val)) return;
    setScores(p => {
      const prev = p[mid] || {};
      const next = { ...prev, [side]: val };
      if (next.s1 === "" && next.s2 === "") {
        const copy = { ...p };
        delete copy[mid];
        return copy;
      }
      return { ...p, [mid]: next };
    });
  }, []);

  const handleScorer = useCallback((mid, key, val) => {
    setScorersData(p => ({ ...p, [mid]: { ...(p[mid] || {}), [key]: val } }));
  }, []);

  const handleReset = () => {
    if (window.confirm("Tout réinitialiser ? Les scores, buteurs et noms seront effacés.")) {
      setScores({});
      setScorersData({});
      setNames(INIT_NAMES);
    }
  };

  const handleExport = () => {
    const data = { version: 1, exportDate: new Date().toISOString(), names, scores, scorers: scorersData };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const date = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = "tournoi-sauvegarde-" + date + ".json";
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = JSON.parse(evt.target.result);
        if (!data.names || !data.scores) {
          alert("Fichier invalide : données manquantes.");
          return;
        }
        if (window.confirm("Charger cette sauvegarde ? Les données actuelles seront remplacées.")) {
          setNames(data.names);
          setScores(data.scores);
          setScorersData(data.scorers || {});
        }
      } catch (err) {
        alert("Erreur de lecture : le fichier n'est pas un JSON valide.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

          </div>
          {topS.length === 0 ? (
            <div style={{ padding: "30px 16px", textAlign: "center", fontFamily: "'DM Sans',sans-serif", fontSize: 13, color: "rgba(255,255,255,0.4)" }}>
              Entrez les scores et noms des buteurs dans l'onglet Matchs pour voir le classement ici.
            </div>
          ) : (
            <div>
              {topS.map((s, i) => {
                const rank = getRank(topS, i);
                const medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : null;
                const col = gc(s.team[0]);
                return (
                  <div key={s.name + s.team} style={{
                    display: "flex", alignItems: "center", gap: 10, padding: "10px 14px",
                    borderBottom: i < topS.length - 1 ? "1px solid rgba(255,255,255,0.05)" : "none",
                    background: rank <= 3 ? "rgba(255,215,0,0.05)" : "transparent",
                  }}>
                    <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 14, fontWeight: 700, width: 28, textAlign: "center", color: "rgba(255,255,255,0.4)", flexShrink: 0 }}>
                      {medal || rank}
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 14, fontWeight: 700, color: "#fff", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.name}</div>
                      <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, fontWeight: 600, color: col, marginTop: 1 }}>{dn(s.team)}</div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 4, background: "rgba(255,255,255,0.1)", borderRadius: 8, padding: "4px 10px", flexShrink: 0 }}>
                      <span style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 16, fontWeight: 800, color: "#ffd54f" }}>{s.goals}</span>
                      <span style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 10, fontWeight: 600, color: "rgba(255,255,255,0.4)" }}>but{s.goals > 1 ? "s" : ""}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          {topS.length > 0 && (
            <div style={{ padding: "8px 14px", background: "rgba(255,255,255,0.03)", borderTop: "1px solid rgba(255,255,255,0.06)", fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: "rgba(255,255,255,0.3)", textAlign: "center" }}>
              {topS.length} buteur{topS.length > 1 ? "s" : ""} • {topS.reduce((a, s) => a + s.goals, 0)} buts au total
            </div>
          )}
        </div>
      )}

      {/* ========== CALENDAR ========== */}
      {tab === "calendar" && (
        <div>
          <div style={{ display: "flex", gap: 4, marginBottom: 10, justifyContent: "center", flexWrap: "wrap" }}>
            <button onClick={() => setWeek(null)} style={wkBtn(week === null)}>Tout</button>
            {SCHEDULE.map(w => (
              <button key={w.week} onClick={() => setWeek(w.week)} style={wkBtn(week === w.week)}>S{w.week}</button>
            ))}
          </div>

          <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: "rgba(255,255,255,0.5)", textAlign: "center", marginBottom: 12, padding: "6px 10px", background: "rgba(255,215,0,0.08)", borderRadius: 6, border: "1px solid rgba(255,215,0,0.15)" }}>
            💡 Entrez un score puis tapez sur le match pour ajouter les buteurs
          </div>

          {SCHEDULE.filter(w => week === null || w.week === week).map(w => (
            <div key={w.week} style={{ marginBottom: 14, background: "rgba(255,255,255,0.06)", borderRadius: 10, border: "1px solid rgba(255,255,255,0.1)", overflow: "hidden", backdropFilter: "blur(4px)" }}>
              <div style={{ padding: "10px 14px", borderBottom: "1px solid rgba(255,255,255,0.08)", background: "rgba(255,255,255,0.04)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <span style={{ fontWeight: 700, fontSize: 15, color: "#fff" }}>Semaine {w.week}</span>
                  <span style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: "rgba(255,255,255,0.35)", marginLeft: 8 }}>{w.label}</span>
                </div>
                <span style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: "rgba(255,255,255,0.4)" }}>{w.matches.length} match{w.matches.length > 1 ? "s" : ""}</span>
              </div>
              {w.matches.map((m, i) => {
                const sc = scores[m.id] || {};
                const a = parseInt(sc.s1, 10), b = parseInt(sc.s2, 10);
                const ok = !isNaN(a) && !isNaN(b);
                const hasGoals = ok && (a + b > 0);
                const isOpen = open === m.id;
                const sd = scorersData[m.id] || {};
                const total = hasGoals ? a + b : 0;
                const filled = hasGoals
                  ? [...Array(a)].filter((_, j) => (sd["t1_" + j] || "").trim()).length
                    + [...Array(b)].filter((_, j) => (sd["t2_" + j] || "").trim()).length
                  : 0;
                const col = gc(m.group);

                return (
                  <div key={m.id} style={{ borderBottom: i < w.matches.length - 1 ? "1px solid rgba(255,255,255,0.05)" : "none" }}>
                    <div
                      onClick={() => hasGoals && setOpen(isOpen ? null : m.id)}
                      style={{ padding: "11px 14px", display: "flex", flexDirection: "column", gap: 6, cursor: hasGoals ? "pointer" : "default" }}
                    >
                      <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                        <span style={{ display: "inline-block", padding: "2px 8px", borderRadius: 4, fontSize: 11, fontWeight: 600, color: m.day === "Mardi" ? "#ffd54f" : "#ce93d8", background: m.day === "Mardi" ? "rgba(255,213,79,0.12)" : "rgba(206,147,216,0.12)" }}>{m.day} {m.date}</span>
                        <span style={{ display: "inline-block", padding: "1px 6px", borderRadius: 4, fontSize: 10, fontWeight: 700, letterSpacing: .5, color: "#fff", background: col }}>POULE {m.group}</span>
                        {hasGoals && (
                          <span style={{
                            marginLeft: "auto", fontFamily: "'DM Sans',sans-serif", fontSize: 10, fontWeight: 600,
                            color: filled === total ? "#81c784" : "#ffd54f",
                            background: filled === total ? "rgba(129,199,132,0.12)" : "rgba(255,213,79,0.12)",
                            padding: "1px 6px", borderRadius: 4,
                          }}>
                            {filled === total ? "✓ Buteurs" : filled + "/" + total + " buteurs"} {isOpen ? "▲" : "▼"}
                          </span>
                        )}
                      </div>

                      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 5 }}>
                        <span style={{ fontFamily: "'DM Sans',sans-serif", fontWeight: 700, fontSize: 13, textAlign: "right", flex: 1, color: col }}>{dn(m.team1)}</span>
                        <div onClick={e => e.stopPropagation()} style={{ display: "flex", alignItems: "center", gap: 3, background: "rgba(255,255,255,0.06)", borderRadius: 6, padding: "3px 5px" }}>
                          <input type="text" inputMode="numeric" maxLength={2}
                            value={sc.s1 !== undefined ? sc.s1 : ""}
                            onChange={e => handleScore(m.id, "s1", e.target.value)}
                            placeholder="-"
                            style={sIn(ok && a > b)} />
                          <span style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, fontWeight: 700, color: "rgba(255,255,255,0.2)" }}>:</span>
                          <input type="text" inputMode="numeric" maxLength={2}
                            value={sc.s2 !== undefined ? sc.s2 : ""}
                            onChange={e => handleScore(m.id, "s2", e.target.value)}
                            placeholder="-"
                            style={sIn(ok && b > a)} />
                        </div>
                        <span style={{ fontFamily: "'DM Sans',sans-serif", fontWeight: 700, fontSize: 13, textAlign: "left", flex: 1, color: col }}>{dn(m.team2)}</span>
                      </div>

                      <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: "rgba(255,255,255,0.35)", display: "flex", alignItems: "center", gap: 4 }}>
                        🟨 Arbitre : <strong style={{ color: "rgba(255,255,255,0.55)" }}>{dn(m.ref)}</strong>
                      </div>
                    </div>

                    {isOpen && hasGoals && (
                      <div onClick={e => e.stopPropagation()} style={{ padding: "10px 12px 12px", background: "rgba(255,255,255,0.03)", borderTop: "1px dashed rgba(255,255,255,0.1)", display: "flex", gap: 10 }}>
                        {a > 0 && (
                          <div style={{ flex: 1 }}>
                            <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 10, fontWeight: 700, color: col, letterSpacing: .5, marginBottom: 5, textTransform: "uppercase" }}>{dn(m.team1)}</div>
                            {[...Array(a)].map((_, j) => (
                              <div key={j} style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 4 }}>
                                <span style={{ fontSize: 11 }}>⚽</span>
                                <input type="text"
                                  value={sd["t1_" + j] || ""}
                                  onChange={e => handleScorer(m.id, "t1_" + j, e.target.value)}
                                  placeholder={"Buteur " + (j + 1)}
                                  style={{
                                    fontFamily: "'DM Sans',sans-serif", fontSize: 12, fontWeight: 500,
                                    padding: "5px 8px", borderRadius: 5, outline: "none", flex: 1, color: "#e8eaf6",
                                    border: sd["t1_" + j] ? "1.5px solid " + col + "55" : "1px solid rgba(255,255,255,0.12)",
                                    background: sd["t1_" + j] ? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.03)",
                                  }} />
                              </div>
                            ))}
                          </div>
                        )}
                        {b > 0 && (
                          <div style={{ flex: 1 }}>
                            <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 10, fontWeight: 700, color: col, letterSpacing: .5, marginBottom: 5, textTransform: "uppercase" }}>{dn(m.team2)}</div>
                            {[...Array(b)].map((_, j) => (
                              <div key={j} style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 4 }}>
                                <span style={{ fontSize: 11 }}>⚽</span>
                                <input type="text"
                                  value={sd["t2_" + j] || ""}
                                  onChange={e => handleScorer(m.id, "t2_" + j, e.target.value)}
                                  placeholder={"Buteur " + (j + 1)}
                                  style={{
                                    fontFamily: "'DM Sans',sans-serif", fontSize: 12, fontWeight: 500,
                                    padding: "5px 8px", borderRadius: 5, outline: "none", flex: 1, color: "#e8eaf6",
                                    border: sd["t2_" + j] ? "1.5px solid " + col + "55" : "1px solid rgba(255,255,255,0.12)",
                                    background: sd["t2_" + j] ? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.03)",
                                  }} />
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
